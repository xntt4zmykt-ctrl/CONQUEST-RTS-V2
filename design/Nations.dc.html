<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; font-family: Montserrat, "Gotham", system-ui, sans-serif; }
    a { color: #2DC2B1; } a:hover { color: #56DA99; }
    .panel { background: rgba(10, 17, 28, 0.86); border: 1px solid #2F485D; }
    .btn { background: #121D2D; border: 1px solid #2F485D; border-radius: 6px; }
  </style>
</helmet>

<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #050910;">

  <div style="position: absolute; inset: 0; background:
      radial-gradient(circle at 34% 40%, #10243B 0%, #071322 55%, #050910 100%);"></div>
  <div style="position: absolute; inset: 0; opacity: 0.22; background-image:
      linear-gradient(#2F485D 1px, transparent 1px),
      linear-gradient(90deg, #2F485D 1px, transparent 1px);
      background-size: 64px 64px;"></div>
  <div style="position: absolute; left: 90px; top: 130px; width: 400px; height: 320px;
      background: #E74C3C; opacity: 0.75;
      clip-path: polygon(18% 4%, 62% 0%, 88% 22%, 100% 58%, 74% 92%, 34% 100%, 6% 70%, 0% 30%);"></div>
  <div style="position: absolute; left: 370px; top: 250px; width: 320px; height: 290px;
      background: #3498DB; opacity: 0.75;
      clip-path: polygon(24% 0%, 76% 10%, 100% 44%, 86% 84%, 44% 100%, 8% 78%, 0% 34%);"></div>

  <!-- BARRE HAUTE : le bouton Classement est actif ------------------------ -->
  <div class="panel" style="position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 16px; height: 40px; padding: 0 12px; border-radius: 8px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 4px; height: 20px; border-radius: 2px; background: #E74C3C;"></div>
      <span style="color: #EFF7FA; font-size: 13px; font-weight: 700;">VALORIA</span>
    </div>
    <div style="width: 1px; height: 18px; background: #2F485D;"></div>
    <span style="color: #EFF7FA; font-size: 13px; font-weight: 900; font-variant-numeric: tabular-nums;">17:58</span>
    <div style="width: 1px; height: 18px; background: #2F485D;"></div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="color: #9CB7C2; font-size: 11px; font-weight: 700;">INDUSTRIE</span>
      <div style="width: 44px; height: 3px; border-radius: 999px; background: #121D2D;">
        <div style="width: 68%; height: 100%; border-radius: 999px; background: #2DC2B1;"></div>
      </div>
    </div>
    <div style="width: 1px; height: 18px; background: #2F485D;"></div>
    <div style="display: flex; gap: 4px;">
      <div style="width: 28px; height: 26px; border-radius: 6px; background: #2DC2B1;
          display: flex; align-items: center; justify-content: center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#050910" stroke-width="2.2">
          <path d="M4 6h16M4 12h16M4 18h10"></path></svg>
      </div>
      <div class="btn" style="width: 28px; height: 26px; display: flex; align-items: center; justify-content: center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9CB7C2" stroke-width="2">
          <path d="M16 20v-2a4 4 0 0 0-8 0v2"></path><circle cx="12" cy="8" r="3.2"></circle></svg>
      </div>
    </div>
  </div>

  <!-- SOUS-MENU : NATIONS (classement + diplomatie fusionnes) -------------- -->
  <div class="panel" style="position: absolute; top: 62px; right: 12px; width: 306px;
      border-radius: 8px; padding: 12px; backdrop-filter: blur(8px);">

    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
      <span style="color: #658492; font-size: 10px; font-weight: 700; letter-spacing: 0.1em;">DOMINATION</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#658492" stroke-width="2">
        <path d="M6 6l12 12M18 6L6 18"></path></svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 3px;">

      <div style="position: relative; display: flex; align-items: center; gap: 8px; height: 26px;
          padding: 0 8px; border-radius: 4px; overflow: hidden;">
        <div style="position: absolute; inset: 0; width: 100%; background: #E74C3C; opacity: 0.2;"></div>
        <span style="position: relative; color: #EFF7FA; font-size: 11px; font-weight: 900; width: 12px;">1</span>
        <span style="position: relative; color: #EFF7FA; font-size: 11px; font-weight: 700; flex-grow: 1;">Valoria</span>
        <span style="position: relative; color: #658492; font-size: 11px; font-weight: 500;">2 840</span>
      </div>

      <!-- Nation selectionnee : sa fiche se deplie ici, pas ailleurs -->
      <div style="border-radius: 6px; background: #121D2D; border: 1px solid #2DC2B1; overflow: hidden;">
        <div style="position: relative; display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px;">
          <div style="position: absolute; inset: 0; width: 78%; background: #3498DB; opacity: 0.24;"></div>
          <span style="position: relative; color: #EFF7FA; font-size: 11px; font-weight: 900; width: 12px;">2</span>
          <span style="position: relative; color: #EFF7FA; font-size: 11px; font-weight: 700; flex-grow: 1;">Kerensk</span>
          <svg style="position: relative;" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFB445" stroke-width="2.2">
            <path d="M12 4l9 16H3z"></path><path d="M12 10v4"></path></svg>
          <span style="position: relative; color: #658492; font-size: 11px; font-weight: 500;">2 210</span>
        </div>

        <div style="padding: 10px; display: flex; flex-direction: column; gap: 9px;">
          <div style="display: flex; gap: 8px; align-items: center;">
            <div style="width: 34px; height: 22px; border-radius: 3px; overflow: hidden; display: flex; flex-direction: column;">
              <div style="flex-grow: 1; background: #F0F0F0;"></div>
              <div style="flex-grow: 1; background: #285ABE;"></div>
              <div style="flex-grow: 1; background: #BE2328;"></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 1px;">
              <span style="color: #FFB445; font-size: 10px; font-weight: 700;">2 trahisons</span>
              <span style="color: #658492; font-size: 10px; font-weight: 500;">Ere Fortification</span>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px;">
            <div class="btn" style="padding: 6px; display: flex; align-items: center; justify-content: center; gap: 5px;
                border-color: #56DA99;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#56DA99" stroke-width="2">
                <path d="M8 12l3 3 6-6"></path><circle cx="12" cy="12" r="9"></circle></svg>
              <span style="color: #56DA99; font-size: 10px; font-weight: 700;">Alliance</span>
            </div>
            <div class="btn" style="padding: 6px; display: flex; align-items: center; justify-content: center; gap: 5px;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFB445" stroke-width="2">
                <circle cx="12" cy="12" r="9"></circle><path d="M6 6l12 12"></path></svg>
              <span style="color: #FFB445; font-size: 10px; font-weight: 700;">Embargo</span>
            </div>
          </div>
        </div>
      </div>

      <div style="position: relative; display: flex; align-items: center; gap: 8px; height: 26px;
          padding: 0 8px; border-radius: 4px; overflow: hidden;">
        <div style="position: absolute; inset: 0; width: 52%; background: #2ECC71; opacity: 0.2;"></div>
        <span style="position: relative; color: #9CB7C2; font-size: 11px; font-weight: 900; width: 12px;">3</span>
        <span style="position: relative; color: #EFF7FA; font-size: 11px; font-weight: 700; flex-grow: 1;">Odaria</span>
        <svg style="position: relative;" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#56DA99" stroke-width="2.2">
          <path d="M7 11V8a5 5 0 0 1 10 0v3"></path><rect x="5" y="11" width="14" height="9" rx="2"></rect></svg>
        <span style="position: relative; color: #658492; font-size: 11px; font-weight: 500;">1 470</span>
      </div>

      <div style="position: relative; display: flex; align-items: center; gap: 8px; height: 26px;
          padding: 0 8px; border-radius: 4px; overflow: hidden;">
        <div style="position: absolute; inset: 0; width: 31%; background: #F1C40F; opacity: 0.2;"></div>
        <span style="position: relative; color: #9CB7C2; font-size: 11px; font-weight: 900; width: 12px;">4</span>
        <span style="position: relative; color: #EFF7FA; font-size: 11px; font-weight: 700; flex-grow: 1;">Thane</span>
        <span style="position: relative; color: #658492; font-size: 11px; font-weight: 500;">880</span>
      </div>

      <div style="position: relative; display: flex; align-items: center; gap: 8px; height: 26px;
          padding: 0 8px; border-radius: 4px; overflow: hidden;">
        <div style="position: absolute; inset: 0; width: 18%; background: #9B59B6; opacity: 0.2;"></div>
        <span style="position: relative; color: #9CB7C2; font-size: 11px; font-weight: 900; width: 12px;">5</span>
        <span style="position: relative; color: #EFF7FA; font-size: 11px; font-weight: 700; flex-grow: 1;">Miravel</span>
        <span style="position: relative; color: #658492; font-size: 11px; font-weight: 500;">510</span>
      </div>

    </div>
  </div>

  <!-- BARRE BASSE ---------------------------------------------------------- -->
  <div class="panel" style="position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 20px; width: 720px; height: 92px; padding: 0 16px; border-radius: 8px;">
    <div style="display: flex; flex-direction: column; gap: 3px; width: 132px;">
      <div style="display: flex; align-items: baseline; gap: 5px;">
        <span style="color: #EFF7FA; font-size: 28px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums;">5 140</span>
        <span style="color: #658492; font-size: 10px; font-weight: 700;">/ 7.2k</span>
      </div>
      <div style="width: 100%; height: 3px; border-radius: 999px; background: #121D2D;">
        <div style="width: 71%; height: 100%; border-radius: 999px; background: #66B2F2;"></div>
      </div>
      <div style="display: flex; align-items: center; gap: 5px; margin-top: 2px;">
        <span style="color: #F6C14D; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;">1 902</span>
        <span style="color: #658492; font-size: 10px; font-weight: 500;">+18/s</span>
      </div>
    </div>
    <div style="width: 1px; height: 56px; background: #2F485D;"></div>
    <div style="display: flex; flex-direction: column; gap: 7px; flex-grow: 1;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span style="color: #658492; font-size: 10px; font-weight: 700; letter-spacing: 0.08em;">ENGAGEMENT</span>
        <span style="color: #9CB7C2; font-size: 11px; font-weight: 500;">35 % — 1 799 troupes</span>
      </div>
      <div style="position: relative; height: 10px; border-radius: 999px; background: #121D2D;">
        <div style="position: absolute; inset: 0; width: 35%; border-radius: 999px; background: #2DC2B1;"></div>
        <div style="position: absolute; left: 35%; top: 50%; width: 14px; height: 14px; margin-left: -7px;
            transform: translateY(-50%); border-radius: 999px; background: #EFF7FA; border: 2px solid #2DC2B1;"></div>
      </div>
    </div>
    <div style="width: 1px; height: 56px; background: #2F485D;"></div>
    <div style="display: flex; gap: 6px;">
      <div style="width: 60px; height: 60px; border-radius: 6px; background: #2DC2B1;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#050910" stroke-width="2.2">
          <path d="M4 20L20 4M14 4h6v6"></path></svg>
        <span style="color: #050910; font-size: 9px; font-weight: 900;">ATTAQUER</span>
      </div>
      <div class="btn" style="width: 60px; height: 60px; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CB7C2" stroke-width="2">
          <path d="M3 17l2.5-6h13L21 17M5 17h14M12 11V5M8 8h8"></path></svg>
        <span style="color: #9CB7C2; font-size: 9px; font-weight: 700;">DEBARQUER</span>
      </div>
      <div class="btn" style="width: 60px; height: 60px; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CB7C2" stroke-width="2">
          <path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6"></path></svg>
        <span style="color: #9CB7C2; font-size: 9px; font-weight: 700;">CONSTRUIRE</span>
      </div>
      <div class="btn" style="width: 60px; height: 60px; opacity: 0.45; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#658492" stroke-width="2">
          <circle cx="12" cy="12" r="2.5"></circle>
          <path d="M12 3v4M12 17v4M4.5 7.5l3.2 2M16.3 14.5l3.2 2M4.5 16.5l3.2-2M16.3 9.5l3.2-2"></path></svg>
        <span style="color: #658492; font-size: 9px; font-weight: 700;">FRAPPE</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
