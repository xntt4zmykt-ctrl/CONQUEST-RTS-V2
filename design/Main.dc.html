<!doctype html>

<body>
<x-dc>

    a { color: #2DC2B1; } a:hover { color: #56DA99; }

      linear-gradient(#2F485D 1px, transparent 1px),
      linear-gradient(90deg, #2F485D 1px, transparent 1px);

  <div style="position: absolute; left: 120px; top: 130px; width: 430px; height: 330px;

    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 4px; height: 20px; border-radius: 2px; background: #E74C3C;"></div>

    <div style="width: 1px; height: 18px; background: #2F485D;"></div>

      </svg>

    <div style="display: flex; gap: 4px;">
      <div class="btn" style="width: 28px; height: 26px; display: flex; align-items: center; justify-content: center;">

      </div>

        </svg>
      </div>
    </div>

  <!-- FIL DE NOTIFICATIONS ---------------------------------------------- -->

  <!-- 3. MINIMAP --------------------------------------------------------- -->

        <span style="color: #F6C14D; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;">2 140</span>

      </div>
    </div>

    <div style="width: 1px; height: 56px; background: #2F485D;"></div>

    <!-- Engagement -->

      <div style="display: flex; justify-content: space-between; align-items: baseline;">

      </div>
      <div style="position: relative; height: 10px; border-radius: 999px; background: #121D2D;">
        <div style="position: absolute; inset: 0; width: 35%; border-radius: 999px; background: #2DC2B1;"></div>
        <div style="position: absolute; left: 35%; top: 50%; width: 14px; height: 14px; margin-left: -7px;
            transform: translateY(-50%); border-radius: 999px; background: #EFF7FA; border: 2px solid #2DC2B1;"></div>
      </div>
    </div>

    <div style="width: 1px; height: 56px; background: #2F485D;"></div>

    <!-- Actions -->
    <div style="display: flex; gap: 6px;">
      <div style="position: relative; width: 60px; height: 60px; border-radius: 6px; background: #2DC2B1;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#050910" stroke-width="2.2">
          <path d="M4 20L20 4M14 4h6v6"></path>
        </svg>
        <span style="color: #050910; font-size: 9px; font-weight: 900;">ATTAQUER</span>
        <span style="position: absolute; top: 3px; right: 5px; color: rgba(5,9,16,0.55); font-size: 9px; font-weight: 700;">1</span>
      </div>
      <div class="btn" style="position: relative; width: 60px; height: 60px;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CB7C2" stroke-width="2">
          <path d="M3 17l2.5-6h13L21 17M5 17h14M12 11V5M8 8h8"></path>

        <span style="color: #9CB7C2; font-size: 9px; font-weight: 700;">DEBARQUER</span>
        <span style="position: absolute; top: 3px; right: 5px; color: #658492; font-size: 9px; font-weight: 700;">2</span>
      </div>
      <div class="btn" style="position: relative; width: 60px; height: 60px;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CB7C2" stroke-width="2">
          <path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6"></path>
        </svg>
        <span style="color: #9CB7C2; font-size: 9px; font-weight: 700;">CONSTRUIRE</span>
        <span style="position: absolute; top: 3px; right: 5px; color: #658492; font-size: 9px; font-weight: 700;">3</span>
      </div>

          <rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path>

    </div>
